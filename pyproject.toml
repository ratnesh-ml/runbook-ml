[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-ml"
version = "0.1.0"
description = "A small, transparent experiment tracker and model registry"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runbook = "runbook_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
